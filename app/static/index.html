<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise RAG</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dc; --accent: #2f5bd3; --accent-soft: #e8eefc; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94;
      --border: #33332f; --accent: #7c9cf5; --accent-soft: #252c40; --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--border); background: var(--panel); padding: 20px; overflow-y: auto; }
  main { display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .drop { border: 1.5px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; font-size: 14px; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .docs { list-style: none; padding: 0; margin: 16px 0 0; }
  .docs li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .docs .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docs .meta { color: var(--muted); font-size: 12px; }
  .docs button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .docs button:hover { color: var(--error); }
  .status { font-size: 12px; margin-top: 10px; color: var(--muted); white-space: pre-line; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 760px; margin: 0 auto 18px; }
  .q { font-weight: 600; }
  .a { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 6px; white-space: pre-wrap; }
  .a.err { color: var(--error); }
  .tag { color: var(--accent); font-weight: 600; font-size: 12px; cursor: default; }
  .sources { margin-top: 10px; font-size: 13px; }
  .sources details { border-top: 1px solid var(--border); padding: 6px 0; }
  .sources summary { cursor: pointer; }
  .sources p { color: var(--muted); margin: 6px 0 0; white-space: pre-wrap; }
  form { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border); background: var(--panel); }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  form button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  .a.pending { color: var(--muted); }
  .a.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .thinking summary { cursor: pointer; }
  .thinking .trace { margin-top: 6px; padding: 8px 10px; border-left: 2px solid var(--border); max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    aside { border-right: none; border-bottom: 1px solid var(--border); padding: 16px; }
    #chat { padding: 16px; } form { padding: 12px 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Documents</h1>
    <p class="sub">PDF, DOCX, TXT, MD, HTML</p>
    <label class="drop" id="drop">
      Drop files or click to upload
      <input type="file" id="file" multiple hidden accept=".pdf,.docx,.txt,.md,.html,.htm">
    </label>
    <div class="status" id="status"></div>
    <ul class="docs" id="docs"></ul>
  </aside>
  <main>
    <div id="chat"><div class="empty" id="empty">Ask a question about your uploaded documents.</div></div>
    <form id="ask">
      <input type="text" id="question" placeholder="e.g. How many days of leave do new employees get?" autocomplete="off" required>
      <button type="submit" id="send">Ask</button>
    </form>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const label = (c) => c.page ? `${c.filename}, page ${c.page}` : c.filename;

async function loadDocs() {
  const res = await fetch("/api/documents");
  const { documents } = await res.json();
  $("docs").innerHTML = documents.map((d) => `
    <li><div><div class="name" title="${esc(d.filename)}">${esc(d.filename)}</div>
    <div class="meta">${d.chunks} chunks</div></div>
    <button title="Delete" data-id="${d.doc_id}">×</button></li>`).join("");
}

$("docs").addEventListener("click", async (e) => {
  const id = e.target.dataset.id;
  if (!id || !confirm("Delete this document from the index?")) return;
  await fetch(`/api/documents/${id}`, { method: "DELETE" });
  loadDocs();
});

async function upload(files) {
  if (!files.length) return;
  $("status").textContent = `Indexing ${files.length} file(s)…`;
  const body = new FormData();
  for (const f of files) body.append("files", f);
  try {
    const res = await fetch("/api/documents", { method: "POST", body });
    const { results } = await res.json();
    $("status").textContent = results.map((r) =>
      r.status === "indexed" ? `✓ ${r.filename} (${r.chunks} chunks)` :
      r.status === "duplicate" ? `• ${r.filename} already indexed` :
      `✗ ${r.filename}: ${r.detail}`).join("\n");
  } catch (err) {
    $("status").textContent = `Upload failed: ${err}`;
  }
  loadDocs();
}

$("file").addEventListener("change", (e) => { upload(e.target.files); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); });

function renderAnswer(data) {
  const byTag = Object.fromEntries(data.citations.map((c) => [c.tag, c]));
  const html = esc(data.answer).replace(/\[(S\d+)\]/g, (m, tag) =>
    byTag[tag] ? `<span class="tag" title="${esc(label(byTag[tag]))}">[${tag}]</span>` : "");
  const sources = data.citations.map((c) => `
    <details><summary><span class="tag">[${c.tag}]</span> ${esc(label(c))}</summary>
    <p>${esc(c.snippet)}</p></details>`).join("");
  return `<div class="a">${html}</div>${sources ? `<div class="sources">${sources}</div>` : ""}`;
}

// Parse a Server-Sent Events response body into {event, data} objects.
async function* readEvents(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) !== -1) {
      const raw = buf.slice(0, i);
      buf = buf.slice(i + 2);
      let event = "message", data = "";
      for (const line of raw.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (data) yield { event, data: JSON.parse(data) };
    }
  }
}

const nearBottom = () => { const c = $("chat"); return c.scrollHeight - c.scrollTop - c.clientHeight < 80; };

// Reveals text gradually so a fast burst from the model still reads as
// streaming: each frame shows a slice of what's queued (bigger when more
// is waiting), down to one character at a time.
function typewriter(el, onTick) {
  let shown = "", queue = "", timer = null, idle = null;
  const tick = () => {
    const n = document.hidden ? queue.length : Math.max(1, Math.ceil(queue.length / 30));
    shown += queue.slice(0, n);
    queue = queue.slice(n);
    el.textContent = shown;
    onTick();
    if (queue) timer = setTimeout(tick, 16);
    else { timer = null; idle?.(); idle = null; }
  };
  return {
    push(text) { queue += text; if (!timer) timer = setTimeout(tick, 16); },
    // Resolves once everything pushed so far is on screen.
    drained: () => (queue || timer) ? new Promise((r) => { idle = r; }) : Promise.resolve(),
  };
}

const thinkingHtml = (text, seconds) => text ? `
  <details class="thinking"><summary>Thought for ${seconds}s</summary>
  <div class="trace">${esc(text)}</div></details>` : "";

async function askStreaming(question, msg, qHtml, showError) {
  const res = await fetch("/api/ask/stream", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    return showError(data.detail || "Request failed");
  }
  const answerEl = msg.querySelector(".a");
  const follow = () => { if (nearBottom()) $("chat").scrollTop = $("chat").scrollHeight; };
  const writer = typewriter(answerEl, follow);
  let thinkingText = "", thinkingEl = null, traceEl = null, thinkStart = 0, thinkSecs = 0;
  let started = false, finished = false;

  for await (const { event, data } of readEvents(res)) {
    if (event === "sources") {
      answerEl.textContent = data.retrieved.length ? "Reading the sources…" : "Searching…";
    } else if (event === "thinking") {
      if (!thinkingEl) {
        thinkStart = performance.now();
        answerEl.textContent = "Thinking…";
        thinkingEl = document.createElement("details");
        thinkingEl.className = "thinking";
        thinkingEl.open = true;
        thinkingEl.innerHTML = `<summary>Thinking…</summary><div class="trace"></div>`;
        msg.insertBefore(thinkingEl, answerEl);
        traceEl = thinkingEl.querySelector(".trace");
      }
      thinkingText += data.text;
      traceEl.textContent = thinkingText;
      traceEl.scrollTop = traceEl.scrollHeight;
      follow();
    } else if (event === "token") {
      if (!started) {
        started = true;
        if (thinkingEl) {
          thinkSecs = Math.max(1, Math.round((performance.now() - thinkStart) / 1000));
          thinkingEl.open = false;
          thinkingEl.querySelector("summary").textContent = `Thought for ${thinkSecs}s`;
        }
        answerEl.textContent = "";
        answerEl.classList.remove("pending");
        answerEl.classList.add("streaming");
      }
      writer.push(data.text);  // raw text; citations render on "done"
    } else if (event === "done") {
      if (thinkingEl && !thinkSecs) thinkSecs = Math.max(1, Math.round((performance.now() - thinkStart) / 1000));
      await writer.drained();
      // Replace the raw stream with the validated answer and its citations.
      msg.innerHTML = qHtml + thinkingHtml(thinkingText, thinkSecs) + renderAnswer(data);
      finished = true;
    } else if (event === "error") {
      showError(data.detail || "Request failed");
      finished = true;
    }
  }
  if (!finished) showError("The response was cut off before it finished.");
}

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;
  $("empty")?.remove();
  const msg = document.createElement("div");
  msg.className = "msg";
  const qHtml = `<div class="q">${esc(question)}</div>`;
  const showError = (text) => { msg.innerHTML = qHtml + `<div class="a err">${esc(text)}</div>`; };
  msg.innerHTML = qHtml + `<div class="a pending">Searching…</div>`;
  $("chat").appendChild(msg);
  msg.scrollIntoView({ behavior: "smooth" });
  $("question").value = "";
  $("send").disabled = true;
  try {
    await askStreaming(question, msg, qHtml, showError);
  } catch (err) {
    showError(String(err));
  }
  $("send").disabled = false;
  $("question").focus();
});

loadDocs();
</script>
</body>
</html>
